<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriTest se ha mudado</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://nutritest-julie.netlify.app/">
  <meta http-equiv="refresh" content="3; url=https://nutritest-julie.netlify.app/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           font-family: system-ui, sans-serif; background: #f6f8f1; color: #1d2b22; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #121a15; color: #e8efe9; } }
    main { max-width: 440px; }
    .icono { font-size: 3.5rem; }
    a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 99px; background: #2f9e5b;
        color: #fff; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="icono" aria-hidden="true">🥗</div>
    <h1>NutriTest se ha mudado</h1>
    <p>Ahora tiene su propia web, con cuentas y contraseña. Tu progreso ya está allí.</p>
    <a href="https://nutritest-julie.netlify.app/">Ir a la web nueva</a>
  </main>
  <script>
    // Quitar la app antigua instalada (service worker y caché) y saltar a la nueva
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
    setTimeout(() => location.replace('https://nutritest-julie.netlify.app/'), 1500);
  </script>
</body>
</html>
